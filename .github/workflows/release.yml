name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # needed to create the release and upload the zip

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Work out the version from the tag
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$tag' must look like v1.2.3 or v1.2.3-playtest1"
          }
          "VERSION_FULL=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NUMERIC=$($Matches[1])"    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_PRE=$($tag.Contains('-'))"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: .\gradlew.bat build installDist "-PappVersion=$env:VERSION_FULL"

      - name: Package the app
        run: |
          $jar = Get-ChildItem build/install/Just-Serves/lib -Filter 'Just-Serves-*.jar' | Select-Object -First 1
          if (-not $jar) { throw 'App jar not found in build/install/Just-Serves/lib' }

          $jpackageArgs = @(
            '--type', 'app-image',
            '--name', 'Just Serves',
            '--app-version', $env:VERSION_NUMERIC,
            '--input', 'build/install/Just-Serves/lib',
            '--main-jar', $jar.Name,
            '--main-class', 'justServes.Launcher',
            '--add-modules', 'java.se,jdk.unsupported',
            '--icon', 'packaging/logo.ico',
            '--dest', 'build/dist'
          )
          if ($env:IS_PRE -eq 'True') { $jpackageArgs += '--win-console' }

          & "$env:JAVA_HOME\bin\jpackage.exe" @jpackageArgs
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }

          if (-not (Test-Path 'build/dist/Just Serves/Just Serves.exe')) {
            throw 'Just Serves.exe was not created'
          }

      - name: Zip the app
        run: |
          $zip = "build/dist/Just-Serves-$env:VERSION_FULL-windows.zip"
          Compress-Archive -Path 'build/dist/Just Serves' -DestinationPath $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME, $env:ZIP_PATH,
            '--title', "Just Serves $env:VERSION_FULL",
            '--notes-file', 'packaging/release-notes.md',
            '--verify-tag'
          )
          if ($env:IS_PRE -eq 'True') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }